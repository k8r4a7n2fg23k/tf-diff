[project]
name = "tf-diff"
version = "0.4.0"
description = "Terraform Semantic Diff & Infra Risk Analyzer"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich",
    "typer",
    "typing-extensions>=4.4",
]

[project.scripts]
tf-diff = "tfdiff.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "jsonschema",
    "mutmut",
    "mypy",
    "pip-licenses",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfdiff"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts", "src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RET", "PIE", "PERF", "FURB",
    "PT", "PTH", "TID", "BLE", "TRY", "ERA", "FIX", "TD", "T20", "S", "DTZ", "G", "LOG",
    "PGH", "RUF", "ARG", "FBT", "PL", "ANN401", "D",
]
ignore = [
    "D1",      # docstrings are required only where they explain something; a linter can't judge that
    "FIX002",  # TODO is allowed when it links an issue (TD003)
    "TD002",   # the linked issue names the owner; an author tag goes stale
    "TRY003",  # InputError messages carry the address and path, which is the point of them
]

[tool.ruff.lint.per-file-ignores]
# cli.py is the one place that reads the environment, and Typer wants flags and call defaults
"src/tfdiff/cli.py" = ["TID251", "FBT", "B008"]
# tests assert, use literal numbers, take unused fixtures and patch the environment
"tests/**" = ["S101", "PLR2004", "ARG", "FBT", "D", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Core is deterministic: cli.py passes the time in."
"datetime.datetime.utcnow".msg = "Core is deterministic: cli.py passes the time in."
"datetime.date.today".msg = "Core is deterministic: cli.py passes the date in."
"time.time".msg = "Core is deterministic: cli.py passes the time in."
"random".msg = "Core is deterministic: cli.py passes a seed in."
"uuid.uuid4".msg = "Core is deterministic: derive ids from input."
"os.environ".msg = "Read env in cli.py and pass values in."
"os.getenv".msg = "Read env in cli.py and pass values in."
"abc.ABC".msg = "Use typing.Protocol."
"abc.ABCMeta".msg = "Use typing.Protocol."
"yaml.load".msg = "Use yaml.safe_load."
"pickle".msg = "Input is untrusted."

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "explicit-override",
    "possibly-undefined",
]
plugins = ["pydantic.mypy"]
files = ["scripts", "src", "tests"]
mypy_path = "tests"

[tool.importlinter]
root_package = "tfdiff"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "tfdiff.cli",
    "tfdiff.analysis | tfdiff.report | tfdiff.terraform | tfdiff.config",
    "tfdiff.rules",
    "tfdiff.model",
]

[[tool.importlinter.contracts]]
name = "Core has no I/O frameworks"
type = "forbidden"
source_modules = ["tfdiff.model", "tfdiff.rules", "tfdiff.analysis"]
forbidden_modules = ["pydantic", "typer", "rich", "yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = ["terraform: runs the real terraform binary"]

[tool.coverage.run]
branch = true
source = ["tfdiff"]
omit = ["*/tfdiff/cli.py", "*/tfdiff/report/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = [
    "src/tfdiff/cli.py",
    "src/tfdiff/config.py",
    "src/tfdiff/model/*",
    "src/tfdiff/report/*",
    "src/tfdiff/terraform/*",
]
pytest_add_cli_args_test_selection = ["tests/"]
# tests read the test gate and the examples from the copy too
also_copy = ["scripts/", "examples/"]
